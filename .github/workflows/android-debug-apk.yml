name: Android Debug APK
on:
  push:
    branches: [Master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install
        run: bun install
      - name: Typecheck and unit tests
        run: |
          bun run check
          bun test
      - name: Build web client
        run: bun run build
      - name: Create native Android project
        working-directory: apps/client
        run: bunx cap add android
      - name: Allow HTTP for debug multiplayer
        run: |
          mkdir -p apps/client/android/app/src/debug
          cat > apps/client/android/app/src/debug/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:usesCleartextTraffic="true" />
          </manifest>
          MANIFEST
      - name: Sync Android client
        working-directory: apps/client
        run: bunx cap sync android
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile APK
        working-directory: apps/client/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: realms-unwritten-debug-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
